sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Excluded tests still contribute source coverage through the LCOV report.
# Keep all production src/** files, including CLI and testing helpers, in scope.
sonar.exclusions=test/**,vendor/**,dist/**,coverage/**,node_modules/**,scripts/**,.pi/**,.github/**,*.config.*,tsconfig.json,package.json,package-lock.json,SOURCE.json
